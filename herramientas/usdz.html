<!doctype html>
<!-- Página auxiliar para herramientas/usdz.py: convierte un .glb en .usdz (AR Quick Look
     del iPhone) con el mismo exportador de three.js que usa model-viewer. -->
<html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module">
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';
  window.convertir = async (url) => {
    const gltf = await new GLTFLoader().loadAsync(url);
    const datos = await new USDZExporter().parseAsync(gltf.scene, { quickLookCompatible: true, maxTextureSize: 1024 });
    const bytes = new Uint8Array(datos);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  window.listo = true;
</script></head><body></body></html>
